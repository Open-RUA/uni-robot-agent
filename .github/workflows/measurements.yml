name: Rollout measurement contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -B -m pytest -q tests/test_measurements.py
